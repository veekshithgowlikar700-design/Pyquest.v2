name: Build Polytech Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "index.html is missing. Upload it to the repo root."
            exit 1
          fi

      - name: Create Android project
        run: |
          mkdir -p pq/app/src/main/java/com/polytechquest/app
          mkdir -p pq/app/src/main/assets pq/app/src/main/res/values pq/app/src/main/res/drawable
          cp index.html pq/app/src/main/assets/index.html

          cat > pq/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > pq/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PolytechQuest"
          include(":app")
          EOF

          cat > pq/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > pq/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.polytechquest.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.polytechquest.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > pq/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.PolytechQuest">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > pq/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Polytech Quest</string>
          </resources>
          EOF

          cat > pq/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.PolytechQuest" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > pq/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#111827" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#3776AB" android:pathData="M24,24h60c7,0 12,5 12,12v36c0,7 -5,12 -12,12h-60c-7,0 -12,-5 -12,-12v-36c0,-7 5,-12 12,-12z"/>
              <path android:fillColor="#FFD43B" android:pathData="M30,35h22c4,0 7,3 7,7v10h-7v-8h-15v12h17c4,0 7,3 7,7v10c0,4 -3,7 -7,7h-24v-7h24v-10h-17c-4,0 -7,-3 -7,-7v-14c0,-4 3,-7 7,-7z"/>
              <path android:fillColor="#FFD43B" android:pathData="M61,35h17v7h-10v9h9v7h-9v10h10v7h-17z"/>
          </vector>
          EOF

          cat > pq/app/src/main/java/com/polytechquest/app/MainActivity.java <<'EOF'
          package com.polytechquest.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              private class Bridge {
                  @JavascriptInterface
                  public void setTheme(final boolean dark) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              int bg = dark ? Color.BLACK : Color.parseColor("#F2F2F7");
                              getWindow().setStatusBarColor(bg);
                              getWindow().setNavigationBarColor(bg);
                              View d = getWindow().getDecorView();
                              int f = d.getSystemUiVisibility();
                              if (dark) {
                                  f = f & ~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                              } else {
                                  f = f | View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                              }
                              d.setSystemUiVisibility(f);
                          }
                      });
                  }
              }

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  webView.evaluateJavascript("(window.__back && window.__back())", new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String value) {
                          if (!"true".equals(value)) {
                              finish();
                          }
                      }
                  });
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: pq
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp pq/app/build/outputs/apk/debug/app-debug.apk dist/PolytechQuest-v1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolytechQuest-APK
          path: dist/PolytechQuest-v1-debug.apk
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Polytech Quest APK build ${{ github.run_number }}
          files: dist/PolytechQuest-v1-debug.apk
          make_latest: true
